name: Release

# Push a tag like v0.2.0 to publish a release. Nothing is published unless
# the tag matches the version in Cargo.toml and points at a commit on main,
# the CI checks pass on it, and every binary builds and runs.
#
# A pull request that changes this file, or a manual run, does everything
# except the tag checks and the publishing: a dry run of the builds.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must match Cargo.toml version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  checks:
    name: Checks
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [tag, checks]
    # Run when the gates passed, and in a dry run, where they are skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux binaries are linked statically against musl, so they do
          # not depend on the glibc of the machine they were built on.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
      - name: Install the musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - name: Binary must run
        run: |
          bin="target/$TARGET/release/petrify"
          "$bin" --version
          "$bin" generate tests/fixtures/strace.log --arch x86_64 > /dev/null
      - name: Package
        run: tar -czf "petrify-$TARGET.tar.gz" README.md LICENSE -C "target/$TARGET/release" petrify
      - uses: actions/upload-artifact@v7
        with:
          name: petrify-${{ matrix.target }}
          path: petrify-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum petrify-*.tar.gz | tee SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
