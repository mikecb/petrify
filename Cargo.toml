[package]
name = "petrify"
version = "0.2.0"
edition = "2024"
description = "Turn observed application behaviour (CloudTrail, flow logs, syscall traces) into least-privilege policy"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mikecb/petrify"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
